<title>Minhas Finanças</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: faixa verde com abas no topo; cabeçalho com título manuscrito; painel em grade de 3 colunas (gráficos e tabelas), uma coluna no celular. */
:root{
  --bg:#fbfcfb; --surface:#ffffff; --surface-2:#f2f6f3; --line:#e1e8e3; --rowline:#edf1ee; --thead:#f1f4f2;
  --fg:#1c2a23; --muted:#5d6e65;
  --brand:#1e4b3a; --brand-2:#2a5e49; --brand-fg:#ffffff;
  --accent:#2d7a54; --accent-fg:#ffffff; --accent-soft:#dcefe4;
  --mint:#d7efe2; --pink:#fbdbe1; --peach:#fde2d2; --lav:#e3daf8;
  --c-inc:#7ac698; --c-fix:#f19aab; --c-var:#f7b793; --c-card:#ab9be8; --c-inv:#86cfa4; --c-sal:#2d7a54;
  --pos:#1d8650; --pos-soft:#dcf1e5; --neg:#c43e4d; --neg-soft:#fbe2e5; --warn:#a8670c; --warn-soft:#fcefd6;
  --shadow:0 1px 2px rgba(20,50,35,.05),0 4px 14px rgba(20,50,35,.05);
  --font:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --script:'Great Vibes','Brush Script MT',cursive;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1612; --surface:#15201b; --surface-2:#1b2923; --line:#283a31; --rowline:#22322a; --thead:#1d2c25;
  --fg:#e6efe9; --muted:#9db2a6; --brand:#10291f; --brand-2:#1a3b2e; --brand-fg:#ffffff;
  --accent:#5cbf8a; --accent-fg:#0e1612; --accent-soft:#183a2a;
  --mint:#173528; --pink:#3a2128; --peach:#3a281d; --lav:#29233e;
  --c-inc:#6fc191; --c-fix:#ee8fa2; --c-var:#f2ab84; --c-card:#a495ea; --c-inv:#7fcc9f; --c-sal:#4fb37f;
  --pos:#5fd197; --pos-soft:#163a29; --neg:#f2808d; --neg-soft:#3b1d22; --warn:#e3ac52; --warn-soft:#3a2c14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1612; --surface:#15201b; --surface-2:#1b2923; --line:#283a31; --rowline:#22322a; --thead:#1d2c25;
  --fg:#e6efe9; --muted:#9db2a6; --brand:#10291f; --brand-2:#1a3b2e; --brand-fg:#ffffff;
  --accent:#5cbf8a; --accent-fg:#0e1612; --accent-soft:#183a2a;
  --mint:#173528; --pink:#3a2128; --peach:#3a281d; --lav:#29233e;
  --c-inc:#6fc191; --c-fix:#ee8fa2; --c-var:#f2ab84; --c-card:#a495ea; --c-inv:#7fcc9f; --c-sal:#4fb37f;
  --pos:#5fd197; --pos-soft:#163a29; --neg:#f2808d; --neg-soft:#3b1d22; --warn:#e3ac52; --warn-soft:#3a2c14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
body.noscroll{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px} .pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Faixa de abas */
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--brand);color:var(--brand-fg)}
.tabbar-in{display:flex;align-items:flex-end;gap:14px;max-width:1440px;margin:0 auto;padding-top:8px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs .tab{border:0;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px 10px 0 0;background:rgba(255,255,255,.08);color:#e9f3ee;text-decoration:none;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.tabs .tab:hover{background:rgba(255,255,255,.16)}
.tabs .tab.on{background:var(--bg);color:var(--fg)}
.tabs .tab.on svg{color:var(--accent)}
.tabs .sep{width:1px;background:rgba(255,255,255,.18);margin:8px 4px;flex:none}
.tagline{font-family:var(--script);font-size:27px;white-space:nowrap;padding-bottom:6px;color:#f1f7f3}
@media (max-width:820px){.tagline{display:none}}

/* Cabeçalho */
.head{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:16px 6px}
.title-wrap{margin-right:auto;min-width:0}
.title{font-family:var(--script);font-weight:400;font-size:58px;line-height:1;color:var(--fg);display:flex;align-items:center;gap:10px}
.title svg{width:40px;height:40px;stroke-width:1.4}
.subtitle{margin-top:6px;color:var(--fg);font-size:15px}
.head-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.mes{display:flex;align-items:center;gap:8px;font-weight:600}
.mes select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;min-width:160px}
.search{position:relative;width:240px;max-width:100%}
.search input{width:100%;padding:9px 10px 9px 34px;border:1px solid var(--line);background:var(--surface);border-radius:10px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.newwrap{position:relative}
.dropdown{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:220px;z-index:60;display:flex;flex-direction:column}
.dropdown button{text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:600}
.dropdown button:hover{background:var(--surface-2)}
.demo-bar{max-width:1440px;margin:6px auto 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.demo-bar>div{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border-radius:10px;padding:8px 12px;width:100%}
.demo-bar span{flex:1 1 240px}
.view{max-width:1440px;margin:0 auto;padding-block:12px 40px;display:flex;flex-direction:column;gap:16px}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:9px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;font-size:13.5px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,var(--line))}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted)}
.icon-btn:hover{color:var(--fg)}
.icon-btn.sm{width:28px;height:28px;border-color:transparent;background:none}
.icon-btn.sm svg{width:15px;height:15px}

/* Cards do resumo */
.sumcards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.scard{border-radius:10px;padding:12px 10px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;border:1px solid transparent}
.scard svg{width:34px;height:34px;stroke-width:1.5;margin-bottom:4px}
.scard .l{font-weight:700;font-size:15px}
.scard .v{font-weight:800;font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.scard .s{font-size:11.5px;color:var(--muted)}
.bg-mint{background:var(--mint)} .bg-pink{background:var(--pink)} .bg-peach{background:var(--peach)} .bg-lav{background:var(--lav)}

/* Filtros */
.fbar{display:flex;flex-direction:column;gap:10px;padding:12px 14px}
.frow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.frow .fld{flex:1 1 130px;min-width:120px}
.frow .fld.grow{flex:2 1 210px}
.frow .fld select,.frow .fld input{padding:8px 9px}
.fper{display:flex;align-items:flex-end;gap:6px;flex:1.6 1 250px;min-width:0}
.fper .fld{flex:1}
.fper .fld{min-width:0}
.fbtns{display:flex;gap:6px;flex-wrap:wrap}
.now{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--muted);border-top:1px solid var(--rowline);padding-top:9px}
.now b{color:var(--fg);font-variant-numeric:tabular-nums} .now b.neg{color:var(--neg)} .now b.pos{color:var(--pos)}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbar select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;scroll-margin-top:70px}
.sec-h h2{font-size:21px;font-weight:800;margin-right:auto}
#tblLanc,#tblFat,#tblOrc{scroll-margin-top:70px}

/* Painéis */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.panel>h2,.panel>header h2{font-size:16px;font-weight:800;text-align:center}
.panel>header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.panel>header.left h2{text-align:left;margin-right:auto}
.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,.9fr);gap:12px}
.chart-box{position:relative;height:220px}
.donut-wrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;align-items:center;margin-top:8px}
.donut-wrap .chart-box{height:200px}
.dlegend{display:flex;flex-direction:column;gap:12px;font-size:13.5px}
.dlegend div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.sq{width:11px;height:11px;border-radius:3px;display:inline-block}
.cols3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,.9fr);gap:12px;align-items:start}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}

/* Tabelas com cabeçalho verde */
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.tcard>.th{background:var(--brand);color:var(--brand-fg);text-align:center;font-weight:800;font-size:16px;padding:9px 12px;display:flex;align-items:center;justify-content:center;gap:8px;position:relative}
.tcard>.th .add{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:7px;width:28px;height:28px;display:grid;place-items:center;cursor:pointer}
.tcard>.th .add:hover{background:rgba(255,255,255,.26)}
.twrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t thead th{background:var(--thead);font-weight:700;padding:7px 10px;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}
.t thead th:last-child{border-right:0}
.t td{padding:6px 10px;border-bottom:1px solid var(--rowline);border-right:1px solid var(--rowline);overflow-wrap:break-word}
.t td.r,.t td.c{white-space:nowrap;overflow-wrap:normal}
.t td:last-child{border-right:0}
.t td.r,.t th.r{text-align:right} .t td.c{text-align:center}
.t td.r{font-variant-numeric:tabular-nums}
.t tbody tr:hover td{background:var(--surface-2)}
.t tr.click{cursor:pointer}
.t td.wrap{white-space:normal;min-width:140px}
.t .acts{display:flex;gap:0;justify-content:flex-end}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;font-weight:800;font-size:15.5px}
.tfoot .v{font-variant-numeric:tabular-nums}
.t-empty{padding:18px 12px;text-align:center;color:var(--muted);font-size:13px}
.bar{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--c-inv);border-radius:99px;max-width:100%}
.bar.l1>i{background:var(--warn)} .bar.l2>i{background:#e08a3c} .bar.l3>i{background:var(--neg)}
.pctcell{display:flex;align-items:center;gap:8px}
.pctcell small{font-weight:700;color:var(--accent);min-width:32px;white-space:nowrap}

/* Metas */
.goal{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--rowline)}
.goal:first-child{border-top:0}
.goal .gi{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:var(--accent)}
.goal .gi svg{width:26px;height:26px}
.goal b,.goal .small{display:block}
.goal .gv{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.goal .gp{font-weight:800;font-size:17px}
.quote{background:var(--mint);border-radius:var(--r);padding:14px;text-align:center;font-family:var(--script);font-size:28px;display:flex;align-items:center;justify-content:center;gap:10px}
.quote svg{width:24px;height:24px;stroke-width:1.5;color:var(--accent)}

/* Pills, chips, toolbars */
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.pos{background:var(--pos-soft);color:var(--pos)} .pill.neg{background:var(--neg-soft);color:var(--neg)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.acc{background:var(--lav);color:var(--fg)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar select{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--surface);box-shadow:var(--shadow)}
.split{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.split b{color:var(--fg);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--surface);border:1px solid var(--line)}
.tile .eb{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}
.empty{padding:24px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:4px}
.hint{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:9px;padding:9px 11px;margin:0}
.hint.acc{background:var(--accent-soft);color:var(--fg)} .hint.warn{background:var(--warn-soft);color:var(--fg)}
.alerts{display:flex;flex-direction:column}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 2px;border-top:1px solid var(--rowline)}
.alert:first-child{border-top:0}
.alert .ai{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.alert .ai.neg{background:var(--neg-soft);color:var(--neg)} .alert .ai.warn{background:var(--warn-soft);color:var(--warn)}
.alert b{display:block;font-size:13px} .alert small{color:var(--muted);font-size:12px}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:13px}
.kv span{color:var(--muted)} .kv b{text-align:right;font-variant-numeric:tabular-nums}

/* Cartões visuais */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.cc-wrap{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.ccard{position:relative;aspect-ratio:1.586;max-width:100%;border-radius:14px;padding:16px 18px;color:#fff;display:flex;flex-direction:column;background:linear-gradient(135deg,var(--cc,#334),color-mix(in srgb,var(--cc,#334) 52%,#000));box-shadow:0 8px 22px rgba(10,30,20,.2);overflow:hidden}
.ccard::after{content:"";position:absolute;right:-30%;top:-40%;width:80%;height:120%;border-radius:50%;background:rgba(255,255,255,.07)}
.cc-top{display:flex;justify-content:space-between;font-weight:700;font-size:13px;gap:8px}
.cc-brand{font-style:italic;font-weight:800}
.cc-chip{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#e9d38a,#b8954a);margin-top:14px}
.cc-name{margin-top:auto;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-bot{display:flex;justify-content:space-between;gap:10px;font-size:11px;margin-top:6px}
.cc-bot b{display:block;font-size:14px;font-weight:700}
.cc-status{position:absolute;right:14px;bottom:52px;background:rgba(0,0,0,.45);padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;z-index:1}
.ccard.off{filter:grayscale(.7) brightness(.9)}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}
.alert-line{font-size:12.5px;font-weight:700}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.acc-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--ac)}
.acc-card .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}

/* Calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0;font-weight:700}
.cal button.day{min-height:86px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;overflow:hidden}
.cal button.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal button.day.sel{background:var(--accent-soft)}
.cal .dn{font-weight:800;font-size:12.5px}
.ev{font-size:11px;padding:1px 5px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;color:var(--fg)}
.ev.inc{background:var(--mint)} .ev.exp{background:var(--pink)} .ev.due{background:var(--lav)} .ev.rec{background:var(--peach)}
.ev.done{text-decoration:line-through;opacity:.65}
.cal .more{font-size:10.5px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Modais e formulários */

function parseMoney(s){s=String(s??'').trim().replace(/R\$|\s/g,'');if(!s||s==='-')return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const v=Number(s);return isFinite(v)?r2(v):NaN}

/* =========================================================

   ========================================================= */
const EXP_CATS=[['ali','Alimentação'],['mer','Mercado'],['mor','Moradia'],['agu','Água, luz e internet'],['tra','Transporte e combustível'],['sau','Saúde'],['edu','Educação'],['laz','Lazer'],['ass','Assinaturas'],['com','Compras pessoais'],['via','Viagens'],['imp','Impostos'],['ter','Terceiros'],['out','Outros']];

function defaults(){
  return {version:2,accounts:[],cards:[],
    categories:[...EXP_CATS.map(([id,name],i)=>({id:'e_'+id,name,kind:'exp',color:PAL[i%PAL.length]})),...INC_CATS.map(([id,name],i)=>({id:'i_'+id,name,kind:'inc',color:PAL[(i+1)%PAL.length]}))],
    tx:[],recs:[],goals:[],people:[],budgets:{},meta:{init:true,created:todayStr()}};
}
let S, C=null, cur=ymOf(todayStr()), view='resumo', charts={}, storageOk=true, demoBarHidden=false;

}
function migrate(){
  const d=defaults();
  for(const k of ['accounts','cards','categories','tx','recs','goals','people'])if(!Array.isArray(S[k]))S[k]=d[k];
  if(!S.categories.some(c=>c.id==='e_ter'))S.categories.push({id:'e_ter',name:'Terceiros',kind:'exp',color:'#5fb3c9'});

  S.version=2;
}
function bust(){C=null}

  bust();S.meta.updated=new Date().toISOString();

/* Lookups */
const getAcc=id=>S.accounts.find(a=>a.id===id);

function thirdStats(months,cardId){
  const inM=ym=>!months||months.includes(ym), out={};
  const row=id=>out[id]=out[id]||{id,spent:0,paid:0,items:0};
  for(const e of calc().exp)if(e.catId===TER&&inM(e.ym)&&(!cardId||e.cardId===cardId)){const r=row(e.t.personId||'');r.spent+=e.amount;r.items++}

  for(const r of Object.values(out)){r.spent=r2(r.spent);r.paid=r2(r.paid);r.due=r2(r.spent-r.paid)}

}

const FALLBACK_CARD={closeDay:1,dueDay:10,name:'Cartão removido',color:'#7a8ba0'};
function invoiceDates(c,ym){
  c=c||FALLBACK_CARD;const[y,m]=ymParts(ym);
  const due=mkd(y,m,c.dueDay);
  const cym=c.dueDay>c.closeDay?ym:addYm(ym,-1);const[cy,cm]=ymParts(cym);
  return {close:mkd(cy,cm,c.closeDay),due};
}
function invoiceYmFor(c,date){
  c=c||FALLBACK_CARD;const ym=ymOf(date);const[y,m]=ymParts(ym);
  const close=mkd(y,m,c.closeDay);
  const closeYm=date<close?ym:addYm(ym,1);
  return c.dueDay>c.closeDay?closeYm:addYm(closeYm,1);
}
function buildInst(c,total,n,date,firstYm){

function invStatus(inv,td){

const expStatus=(t,td=todayStr())=>t.status==='pago'?'pago':((t.dueDate||t.date)<td?'atrasado':'pendente');

    else if(t.type==='transfer'){out.push({date:t.date,acc:t.from,v:-t.amount,t,kind:'transfer'});out.push({date:t.date,acc:t.to,v:t.amount,t,kind:'transfer'})}
    else if(t.type==='invpay')out.push({date:t.date,acc:t.accountId,v:-t.amount,t,kind:'invpay'});
    else if(t.type==='invest'&&t.accountId&&t.kind!=='rendimento')out.push({date:t.date,acc:t.accountId,v:t.kind==='resgate'?t.amount:-t.amount,t,kind:'invest'});

function accBalance(id,upTo){

function recDates(r,from,to){
  const out=[], end=r.end&&r.end<to?r.end:to;const[y,m,d]=r.start.split('-').map(Number);
  const step={mensal:1,trimestral:3,semestral:6,anual:12}[r.freq]||1;
  for(let k=0;k<3000;k++){
    const ds=r.freq==='semanal'?isoD(new Date(y,m-1,d+7*k)):mkd(y,m+step*k,d);
    if(ds>end)break;if(ds>=from)out.push(ds);

}

  if(r.kind==='income')return {...base,type:'income',amount:r.amount,date:d,accountId:r.accountId,status:'pendente',fixed:true};
  if(r.method==='credito')return {...base,type:'card',amount:r.amount,date:d,cardId:r.cardId,n:1,status:'ativa',fixed:true,inst:buildInst(getCard(r.cardId),r.amount,1,d)};

function materialize(){
  const keys=new Set(S.tx.filter(t=>t.recKey).map(t=>t.recKey));let n=0;

    if(r.paused)continue;const skip=new Set(r.skip||[]);
    for(const d of recDates(r,r.start,recHorizon(r))){const k=r.id+'|'+d;if(keys.has(k)||skip.has(k))continue;S.tx.push(txFromRec(r,d,k));keys.add(k);n++}
  }

}
function virtualRecs(from,to){
  const keys=new Set(S.tx.filter(t=>t.recKey).map(t=>t.recKey)), out=[];
  for(const r of S.recs){
    if(r.paused)continue;const skip=new Set(r.skip||[]);
    for(const d of recDates(r,from,to)){const k=r.id+'|'+d;if(!keys.has(k)&&!skip.has(k)&&d>recHorizon(r))out.push({r,date:d})}

}
function nextOcc(r){const td=todayStr();const ds=recDates(r,td,addDays(td,800));return ds[0]||null}
function projection(months=6){
  const td=todayStr(), ym0=ymOf(td);let bal=totalBalance();const out=[];
  const virt=virtualRecs(addDays(td,1),endYm(addYm(ym0,months-1)));
  for(let k=0;k<months;k++){
    const ym=addYm(ym0,k);let inn=0,outv=0;
    const inMonth=d=>k===0?(ymOf(d)<=ym):ymOf(d)===ym;
    for(const t of S.tx){
      if(t.type==='income'&&t.status!=='recebido'&&inMonth(t.date))inn+=t.amount;
      if(t.type==='expense'&&t.status!=='pago'&&inMonth(t.dueDate||t.date))outv+=t.amount;
    }
    for(const inv of calc().inv.values())if(inv.rem>0.004&&inMonth(inv.due))outv+=inv.rem;
    for(const v of virt)if(ymOf(v.date)===ym){if(v.r.kind==='income')inn+=v.r.amount;else outv+=v.r.amount}
    inn=r2(inn);outv=r2(outv);bal=r2(bal+inn-outv);

  }
  return out;
}

function maskMoney(el,ev){
  let v=el.value, caret=el.selectionStart==null?v.length:el.selectionStart;
  if(ev&&ev.data==='.'&&caret>0&&v[caret-1]==='.'&&!v.includes(','))v=v.slice(0,caret-1)+','+v.slice(caret);
  const right=v.slice(caret).replace(/[^\d,]/g,'').length;

  const out=(neg?'-':'')+'R$ '+thou(ip||'0')+(dp!==null?','+dp:'');
  el.value=out;
  let pos=out.length;if(right>0){let c=0;for(let i=out.length-1;i>=0;i--){if(/[\d,]/.test(out[i])){c++;if(c===right){pos=i;break}}}}
  try{el.setSelectionRange(pos,pos)}catch(e){}
}

function replaceTx(t,obj){const keep={id:t.id,recId:t.recId,recKey:t.recKey,demo:t.demo};for(const k of Object.keys(t))delete t[k];Object.assign(t,obj,keep);Object.keys(t).forEach(k=>t[k]===undefined&&delete t[k])}

    <div class="fld" data-grp="cash">${fld('Despesa fixa?',selH('fixed',[['0','Não (variável)'],['1','Sim (fixa)']],(v.fixed||preset.fixed)?'1':'0'))}</div>
    <div class="fld" data-grp="credit">${fldD('Cartão de crédito',pickH('card','cardId',cardOpts(v.cardId||preset.cardId),v.cardId||preset.cardId,dis))}</div>
    <div class="fld" data-grp="credit">${fld('Número de parcelas',inpH('n','number',v.n||1,`min="1" max="72" step="1" ${dis}`))}</div>
    <div class="fld" data-grp="credit">${fld('Fatura da 1ª parcela (opcional)',inpH('firstYm','month',isEdit&&isCard&&t.firstYmSet?t.inst[0]?.ym:'',`placeholder="AAAA-MM" ${dis}`))}</div>
    <p class="hint acc full" data-grp="credit" id="instPrev"></p>
    ${notesH(v.notes)}
    ${!isEdit?`<label class="check full"><input type="checkbox" name="rec" id="f_rec"> Repetir automaticamente (recorrente)</label>
    <div class="fld" data-grp="rec">${fld('Periodicidade',selH('freq',Object.entries(FREQ),'mensal'))}</div>
    <div class="fld" data-grp="rec">${fld('Repetir até (opcional)',inpH('end','date',''))}</div>`:''}

  const left=isEdit&&isCard&&!canceled?`<button type="button" class="btn danger sm" data-act="cancelBuy" data-id="${t.id}">Cancelar compra (estorno)</button>`:'';

      const cr=f.elements.method.value==='credito';

      const recOn=f.elements.rec&&f.elements.rec.checked;$$('[data-grp=rec]',f).forEach(e=>e.hidden=!recOn);
      const n=parseInt(f.elements.n.value,10)||1;
      $('#amtLbl',f).textContent=cr&&n>1?'Valor total da compra':'Valor';
      if(f.elements.rec)f.elements.rec.closest('label').hidden=cr&&n>1;

      }
    };
    f.addEventListener('input',upd);f.addEventListener('change',upd);upd();
  }});
}
function saveExpense(d,t,restricted){
  const desc=(d.desc||'').trim();need(desc,'Informe a descrição.');
  if(d.catId===TER)need(getPerson(d.personId),'Selecione o terceiro que fez a compra (cadastre em Cadastros › Terceiros).');
  const pid=d.catId===TER?d.personId:undefined;
  if(restricted){t.desc=desc;t.catId=d.catId;t.notes=d.notes||'';if(pid)t.personId=pid;else delete t.personId;save();toast('Compra atualizada.');render();return}
  const amount=parseMoney(d.amount);need(amount>0,'Informe um valor maior que zero.');
  need(d.date,'Informe a data da compra.');
  const method=d.method, base={desc,amount,date:d.date,catId:d.catId,notes:d.notes||'',personId:pid};
  let obj;
  if(method==='credito'){
    const c=getCard(d.cardId);need(c,'Selecione um cartão de crédito (cadastre um na aba Cartão).');
    const n=parseInt(d.n,10);need(n>=1&&n<=72,'O número de parcelas deve ser entre 1 e 72.');
    const fy=(d.firstYm||'').trim();need(!fy||/^\d{4}-\d{2}$/.test(fy),'A fatura da 1ª parcela deve estar no formato AAAA-MM.');
    if(n>1&&d.rec)throw new Error('Recorrência só vale para compras à vista no cartão.');
    obj={...base,type:'card',cardId:c.id,n,status:'ativa',firstYmSet:!!fy,inst:buildInst(c,amount,n,d.date,fy||null)};
  }else{
    need(getAcc(d.accountId),'Selecione a conta utilizada (cadastre uma na aba Contas).');
    obj={...base,type:'expense',method,accountId:d.accountId,dueDate:d.dueDate||d.date,status:d.status,payDate:d.status==='pago'?(t&&t.payDate||d.date):undefined,fixed:d.fixed==='1'};
  }
  if(!t&&d.rec){
    need(!d.end||d.end>=d.date,'A data final deve ser depois da data inicial.');
    const r={id:uid(),kind:'expense',desc,amount,catId:d.catId,freq:d.freq,start:d.date,end:d.end||'',method,accountId:obj.accountId||'',cardId:obj.cardId||'',skip:[]};
    S.recs.push(r);materialize();
    const first=S.tx.find(x=>x.recKey===r.id+'|'+d.date);
    if(first&&first.type==='expense'){first.status=d.status;if(d.status==='pago')first.payDate=d.date;first.dueDate=obj.dueDate}
    if(first)first.notes=base.notes;
    save();toast('Despesa recorrente criada.');render();return;
  }
  if(t)replaceTx(t,obj);
  else{obj.id=uid();Object.keys(obj).forEach(k=>obj[k]===undefined&&delete obj[k]);S.tx.push(obj)}
  save();toast(t?'Lançamento atualizado.':(method==='credito'?'Compra lançada no cartão.':'Despesa cadastrada.'));if(method!=='credito'&&d.status==='pago')checkLimit(d.accountId);render();
}

      S.recs.push(r);materialize();const first=S.tx.find(x=>x.recKey===r.id+'|'+d.date);

  },{init:f=>{const upd=()=>{const on=f.elements.rec&&f.elements.rec.checked;$$('[data-grp=rec]',f).forEach(e=>e.hidden=!on);$$('[data-grp=ree]',f).forEach(e=>e.hidden=!S.people.length||(f.elements.catId.value!=='i_ree'&&!f.elements.personId.value))};f.addEventListener('change',upd);upd()}});

function openInvoice(key){
  const inv=calc().inv.get(key);
  if(!inv){toast('Fatura não encontrada.','err');return}
  const items=[...inv.items].sort((a,b)=>a.t.date<b.t.date?-1:1), accs=accOpts();
  const html=`
   <div class="kv" style="grid-template-columns:repeat(2,minmax(0,1fr) auto)">
     <span>Cartão</span><b>${esc(cardName(inv.cardId))}</b><span>Referência</span><b>${ymLabel(inv.ym,true)}</b>
     <span>Fechamento</span><b>${fdate(inv.close)}</b><span>Vencimento</span><b>${fdate(inv.due)}</b>
     <span>Valor total</span><b>${money(inv.total)}</b><span>Já pago</span><b class="pos">${money(inv.paid)}</b>
     <span>Restante</span><b class="${inv.rem>0?'neg':''}">${money(Math.max(0,inv.rem))}</b><span>Status</span><b><span class="pill ${INV_PILL[inv.status]}">${INV_ST[inv.status]}</span></b>
   </div>
   <div class="tcard"><div class="th">Compras incluídas (${items.length})</div><div class="twrap"><table class="t"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Parcela</th><th class="r">Valor</th></tr></thead><tbody>
   ${items.map(({t,i})=>`<tr><td>${fdate(i.estorno?t.cancelDate:t.date)}</td><td>${esc(i.estorno?'Estorno: '+t.desc:t.desc)}</td><td>${esc(catName(t.catId))}</td><td class="c">${i.estorno?'—':(t.n>1?`${i.n}/${t.n}`:'1/1')}</td><td class="r ${i.amount<0?'pos':''}">${money(i.amount)}</td></tr>`).join('')||'<tr><td colspan="5" class="t-empty">Nenhuma compra.</td></tr>'}
   </tbody></table></div></div>
   ${inv.pays.length?`<div class="tcard"><div class="th">Pagamentos registrados</div><div class="twrap"><table class="t"><tbody>${inv.pays.map(p=>`<tr><td>${fdate(p.date)}</td><td>${esc(accName(p.accountId))}</td><td class="r">${money(p.amount)}</td><td style="width:40px"><button type="button" class="icon-btn sm" data-act="delPay" data-id="${p.id}" aria-label="Excluir pagamento" title="Excluir pagamento">${ic('trash')}</button></td></tr>`).join('')}</tbody></table></div></div>`:''}
   ${inv.rem>0.004?`<div class="panel" style="background:var(--surface-2);border:0"><b style="display:block;margin-bottom:10px">Registrar pagamento</b>
     ${accs.length?`<div class="fgrid">${fld('Valor pago',moneyH('amount',inv.rem))}${fld('Data do pagamento',inpH('date','date',todayStr()))}${fld('Conta de saída',selH('accountId',accs,accs[0][0]),'full')}</div>
     <p class="hint" style="margin-top:10px">O pagamento sai da conta e reduz a dívida do cartão. As compras já foram contadas como despesa quando foram lançadas, então não entram de novo nos relatórios.</p>`:'<p class="hint warn">Cadastre uma conta para registrar o pagamento.</p>'}</div>`:''}`;
  const canPay=inv.rem>0.004&&accs.length;
  openModal(`Fatura ${esc(cardName(inv.cardId))} · ${ymLabel(inv.ym)}`,html,canPay?(d=>{
    const amount=parseMoney(d.amount);need(amount>0,'Informe o valor pago.');
    need(amount<=inv.rem+0.004,`O valor não pode passar do restante da fatura (${money(inv.rem)}).`);
    need(d.date,'Informe a data do pagamento.');need(getAcc(d.accountId),'Selecione a conta.');
    S.tx.push({id:uid(),type:'invpay',cardId:inv.cardId,ym:inv.ym,amount,date:d.date,accountId:d.accountId});
    save();toast(amount>=inv.rem-0.004?'Fatura paga.':'Pagamento parcial registrado.');checkLimit(d.accountId);render();
  }):null,{size:'wide',submit:'Registrar pagamento'});
}

        ctx.font="800 12px 'Nunito Sans',sans-serif";ctx.fillStyle='#1c2a23';ctx.fillText(Math.round(pc*100)+'%',p.x,p.y+4)}
      else{ctx.font="700 11px 'Nunito Sans',sans-serif";ctx.fillStyle=tok('--fg');ctx.fillText(o.fmt?o.fmt(v):v,el.x,el.y-(chart.config.type==='line'?10:6))}})});

const hasDemo=()=>S.people.some(p=>p.demo)||S.accounts.some(a=>a.demo)||S.cards.some(c=>c.demo)||S.tx.some(t=>t.demo)||S.goals.some(g=>g.demo);

/* ---------- Filtros do painel ---------- */
function F(){return UI.f}
/* Mês escolhido, ou todos os meses que têm lançamentos ("ver tudo") */
function syncRange(){const f=UI.f;
  if(f.mon){f.from=f.to=f.mon;return}
  let lo=ymOf(todayStr()),hi=lo;const see=d=>{if(!d)return;const m=ymOf(d);if(m<lo)lo=m;if(m>hi)hi=m};
  for(const t of S.tx){see(t.date);if(t.dueDate)see(t.dueDate);if(t.type==='card')for(const i of t.inst||[])see(i.ym+'-01')}
  for(const inv of calc().inv.values())see(inv.due);
  f.from=lo;f.to=hi;}
function rangeMonths(){const f=F(),out=[];for(let m=f.from;m<=f.to&&out.length<240;m=addYm(m,1))out.push(m);return out}
const inRange=d=>!UI.f.mon||ymOf(d)===UI.f.mon;
const qMatch=parts=>{const q=norm(F().q).trim();if(!q)return true;const hay=norm(parts.filter(Boolean).join(' '));return q.split(/\s+/).every(w=>hay.includes(w))};
function stOk(st){const s=F().st;if(!s)return true;if(s==='confirmado')return st==='pago'||st==='recebido';return st===s}
const incSt=(t,td=todayStr())=>t.status==='recebido'?'recebido':(t.date<td?'atrasado':'pendente');
const invItemSt=inv=>inv.status==='paga'?'pago':inv.status==='vencida'?'atrasado':'pendente';
const isMonth=()=>!!UI.f.mon;
const perLabel=()=>isMonth()?ymLabel(UI.f.mon,true):'Todos os meses';
const activeFilters=()=>['acc','card','cat','type','st','q'].filter(k=>UI.f[k]).length;
const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:0;

function fIncomes(){const f=F(),td=todayStr();if(f.card||(f.type&&f.type!=='income'))return [];
  return S.tx.filter(t=>t.type==='income'&&inRange(t.date)&&(!f.acc||t.accountId===f.acc)&&(!f.cat||t.catId===f.cat)&&stOk(incSt(t,td))&&qMatch([t.desc,catName(t.catId),accName(t.accountId),t.notes])).sort(byDate)}
function fExpenses(){const f=F();if(f.card||(f.type&&f.type!=='expense'))return [];
  return S.tx.filter(t=>t.type==='expense'&&inRange(t.date)&&(!f.acc||t.accountId===f.acc)&&(!f.cat||t.catId===f.cat)&&stOk(expStatus(t))&&qMatch([t.desc,catName(t.catId),accName(t.accountId),METHODS[t.method],t.notes])).sort(byDate)}
function fInvoices(){const f=F();if(f.acc||(f.type&&f.type!=='card'))return [];
  return invoiceList().filter(i=>inRange(i.due)&&(!f.card||i.cardId===f.card)&&stOk(invItemSt(i))).sort((a,b)=>a.due<b.due?-1:1)}
function fFatItems(){const f=F();return fInvoices().flatMap(inv=>inv.items.filter(({t})=>(!f.cat||t.catId===f.cat)&&qMatch([t.desc,catName(t.catId),cardName(t.cardId),t.notes])).map(x=>({...x,inv}))).sort((a,b)=>a.t.date<b.t.date?-1:1)}
function fInvests(){const f=F();if(f.card||f.cat||(f.type&&f.type!=='invest'))return [];
  return S.tx.filter(t=>t.type==='invest'&&inRange(t.date)&&(!f.acc||t.accountId===f.acc)&&stOk('pago')&&qMatch([t.desc,INVK[t.kind],t.goalId?getGoal(t.goalId)?.name:'',t.notes])).sort(byDate)}
function panelSummary(){
  const inc=fIncomes(),ex=fExpenses(),fat=fFatItems(),iv=fInvests();
  const rec=sum(inc,t=>t.amount),recOk=sum(inc.filter(t=>t.status==='recebido'),t=>t.amount);
  const fix=sum(ex.filter(t=>t.fixed),t=>t.amount),vari=sum(ex.filter(t=>!t.fixed),t=>t.amount);
  const fatV=sum(fat,x=>x.i.amount),inv=sum(iv.filter(t=>t.kind==='aporte'),t=>t.amount);
  return {inc,ex,fat,iv,rec,recOk,fix,vari,fatV,inv,saldo:r2(rec-fix-vari-fatV-inv)};
}
function rowStatus(r){const t=r.t;switch(r.kind){
  case 'income':return incSt(t);
  case 'expense':return expStatus(t);
  case 'card':{if(t.status==='cancelada')return 'cancelada';
    const sts=(t.inst||[]).filter(i=>!i.canceled&&!i.estorno).map(i=>calc().inv.get(t.cardId+'|'+i.ym)).filter(Boolean).map(invItemSt);
    return sts.includes('atrasado')?'atrasado':sts.length&&sts.every(s=>s==='pago')?'pago':'pendente'}
  default:return 'pago'}}
function fRows(){const f=F();
  return allRows().filter(r=>{const t=r.t;
    if(!inRange(r.date))return false;
    if(f.type&&r.kind!==f.type)return false;
    if(f.acc&&![t.accountId,t.from,t.to].includes(f.acc))return false;
    if(f.card&&t.cardId!==f.card)return false;
    if(f.cat&&r.catId!==f.cat)return false;
    if(f.st&&!stOk(rowStatus(r)))return false;
    return qMatch([r.desc,r.catId?catName(r.catId):'',r.where,t.notes||'',r.stl]);
  });
}
function sortRows(rows){
  const[k,dir]=UI.sort.split('-');const m=dir==='asc'?1:-1;
  const key={date:r=>r.date,value:r=>r.amount,cat:r=>norm(r.catId?catName(r.catId):'~'),status:r=>r.stl}[k];
  return rows.sort((a,b)=>{const x=key(a),y=key(b);return (x<y?-1:x>y?1:0)*m||(a.date<b.date?1:-1)});
}
function budgetRange(months){const c=calc(),n=months.length,f=F(),rows=[];
  for(const k of cats('exp'))if(S.budgets[k.id]>0&&(!f.cat||f.cat===k.id))rows.push({name:k.name,plan:r2(S.budgets[k.id]*n),real:sum(c.exp.filter(e=>months.includes(e.ym)&&e.catId===k.id),e=>e.amount)});
  if(S.budgets.__inv>0&&!f.cat)rows.push({name:'Investimentos',plan:r2(S.budgets.__inv*n),real:sum(months,investIn),inv:true});
  return rows;
}
function computeAlerts(ym){
  const c=calc(), td=todayStr(), out=[];
  const late=S.tx.filter(t=>t.type==='expense'&&expStatus(t,td)==='atrasado');
  if(late.length)out.push(['neg',`${late.length} despesa${late.length>1?'s':''} atrasada${late.length>1?'s':''}`,`Total ${money(sum(late,t=>t.amount))}.`,'applyF','type=expense&st=atrasado']);
  for(const inv of invoiceList()){if(inv.rem<=0.004)continue;const dd=daysBetween(td,inv.due);
    if(inv.status==='vencida')out.push(['neg',`Fatura vencida · ${esc(cardName(inv.cardId))}`,`Venceu em ${fdate(inv.due)}. Restam ${money(inv.rem)}.`,'openInv',inv.key]);
    else if(dd>=0&&dd<=7)out.push(['warn',`Fatura vence ${dd===0?'hoje':dd===1?'amanhã':'em '+dd+' dias'} · ${esc(cardName(inv.cardId))}`,`${fdate(inv.due)} · ${money(inv.rem)} a pagar.`,'openInv',inv.key])}
  const soon=S.tx.filter(t=>t.type==='expense'&&t.status!=='pago'&&(t.dueDate||t.date)>=td&&daysBetween(td,t.dueDate||t.date)<=7);
  if(soon.length)out.push(['warn',`${soon.length} conta${soon.length>1?'s':''} vence${soon.length>1?'m':''} em até 7 dias`,`Total ${money(sum(soon,t=>t.amount))}.`,'applyF','type=expense&st=pendente']);
  for(const k of actCards()){if(k.status!=='ativo'||!k.limit)continue;const p=cardStats(k).pct;if(p>=.7)out.push([p>=.85?'neg':'warn',`${esc(k.name)}: ${pctf(p)} do limite usado`,p>=1?'Limite esgotado.':p>=.85?'Acima de 85% do limite.':'Acima de 70% do limite.','goCad','secCartoes'])}
  for(const[cid,b]of Object.entries(S.budgets)){if(cid==='__inv'||!(b>0)||!getCat(cid))continue;const sp=sum(c.exp.filter(e=>e.ym===ym&&e.catId===cid),e=>e.amount);const p=sp/b;if(p>=.8)out.push([p>1?'neg':'warn',`Orçamento de ${esc(catName(cid))}: ${pctf(p)}`,p>1?`Ultrapassou em ${money(sp-b)}.`:`Restam ${money(b-sp)}.`,'jump','tblOrc'])}
  for(const a of actAccounts()){const b=accBalance(a.id),l=accLimit(a.id);
    if(b<-l-0.004)out.push(['neg',`${esc(a.name)}: acima do limite da conta`,`Saldo ${money(b)} com limite de ${money(l)}.`,'goCad','secContas']);
    else if(b<-0.004)out.push([l&&-b/l>=.85?'neg':'warn',`${esc(a.name)}: usando o limite da conta`,`${money(-b)} de ${money(l)} em uso. Disponível ${money(b+l)}.`,'goCad','secContas'])}
  const lateInc=S.tx.filter(t=>t.type==='income'&&t.status!=='recebido'&&t.date<td);
  if(lateInc.length)out.push(['warn',`${lateInc.length} receita${lateInc.length>1?'s':''} prevista${lateInc.length>1?'s':''} sem confirmação`,`Total ${money(sum(lateInc,t=>t.amount))}.`,'applyF','type=income&st=atrasado']);
  return out;
}

   ${lines.map(({m,r,run})=>`<tr><td>${fdate(m.date)}</td><td>${esc(m.kind==='transfer'?(m.v>0?'Recebido de '+accName(m.t.from):'Enviado para '+accName(m.t.to)):r.desc)}</td><td>${esc(r.stl)}</td><td class="r ${m.v<0?'neg':'pos'}">${money(m.v)}</td><td class="r">${money(run)}</td></tr>`).join('')||'<tr><td colspan="5" class="t-empty">Nenhuma movimentação confirmada.</td></tr>'}

const csvCell=v=>{const s=String(v??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const csvNum=v=>r2(v).toFixed(2).replace('.',',');
function toCsv(rows){
  const tipo={income:'Receita',expense:'Despesa',card:'Compra no cartão',transfer:'Transferência',invpay:'Pagamento de fatura',invest:'Investimento'};
  return ['Data;Tipo;Descrição;Categoria;Conta/Cartão;Status;Valor',...rows.map(r=>[fdate(r.date),tipo[r.kind],r.desc,r.catId?catName(r.catId):'',r.where,r.stl,(r.sign<0?'-':'')+csvNum(r.amount)].map(csvCell).join(';'))].join('\n');
}

function delCategory(id){
  const c=getCat(id), fallback=c.kind==='inc'?'i_outi':'e_out';
  const used=S.tx.filter(t=>t.catId===id).length+S.recs.filter(r=>r.catId===id).length;
  confirmBox(`Excluir a categoria <b>${esc(c.name)}</b>?${used?` ${used} lançamento(s) serão movidos para “Outros”.`:''}`,'Excluir',()=>{
    for(const t of S.tx)if(t.catId===id)t.catId=fallback;for(const r of S.recs)if(r.catId===id)r.catId=fallback;delete S.budgets[id];
    if(UI.f.cat===id)UI.f.cat='';S.categories=S.categories.filter(x=>x.id!==id);save();toast('Categoria excluída.');render()});
}

/* Importação */
const TX_TYPES=['income','expense','card','transfer','invpay','invest'];
function validateBackup(o){
  const err=[];
  if(!o||typeof o!=='object')return ['O arquivo não contém um objeto JSON.'];
  for(const k of ['accounts','cards','categories','tx','recs'])if(!Array.isArray(o[k]))err.push(`Falta a lista "${k}".`);
  if(o.goals!==undefined&&!Array.isArray(o.goals))err.push('A lista "goals" é inválida.');
  if(o.people!==undefined&&!Array.isArray(o.people))err.push('A lista "people" é inválida.');
  if(err.length)return err;
  o.accounts.forEach((a,i)=>{if(!a.id||!a.name)err.push(`Conta ${i+1} sem id ou nome.`);if(isNaN(+a.initial))err.push(`Conta ${a.name||i+1} com saldo inicial inválido.`);if(a.limit!=null&&(isNaN(+a.limit)||+a.limit<0))err.push(`Conta ${a.name||i+1} com limite inválido.`)});
  o.cards.forEach((c,i)=>{if(!c.id||!c.name)err.push(`Cartão ${i+1} sem id ou nome.`);if(!(c.closeDay>=1&&c.closeDay<=31&&c.dueDay>=1&&c.dueDay<=31))err.push(`Cartão ${c.name||i+1} com dias inválidos.`);if(isNaN(+c.limit))err.push(`Cartão ${c.name||i+1} com limite inválido.`)});
  o.categories.forEach((c,i)=>{if(!c.id||!c.name||!['exp','inc'].includes(c.kind))err.push(`Categoria ${i+1} inválida.`)});
  (o.goals||[]).forEach((g,i)=>{if(!g.id||!g.name||!(+g.target>0))err.push(`Meta ${i+1} inválida.`)});
  o.tx.forEach((t,i)=>{
    if(!t.id||!TX_TYPES.includes(t.type)){err.push(`Lançamento ${i+1} com tipo inválido.`);return}
    if(!(typeof t.amount==='number'&&isFinite(t.amount)))err.push(`Lançamento ${i+1} com valor inválido.`);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(t.date||''))err.push(`Lançamento ${i+1} com data inválida.`);
    if(t.type==='card'&&!Array.isArray(t.inst))err.push(`Compra ${i+1} sem parcelas.`);
    if(t.type==='invpay'&&!/^\d{4}-\d{2}$/.test(t.ym||''))err.push(`Pagamento ${i+1} sem fatura de referência.`);
    if(t.type==='invest'&&!INVK[t.kind])err.push(`Investimento ${i+1} com movimento inválido.`);
  });
  o.recs.forEach((r,i)=>{if(!r.id||!FREQ[r.freq]||!/^\d{4}-\d{2}-\d{2}$/.test(r.start||''))err.push(`Recorrência ${i+1} inválida.`)});
  return err.slice(0,12);
}
function importDialog(){
  openModal('Importar backup',`<p class="hint warn">Importar substitui todos os dados atuais deste navegador pelos do backup.</p>
   ${fld('Arquivo de backup (.json)','<input type="file" id="impFile" accept=".json,application/json">')}
   ${fld('Ou cole o conteúdo do backup',`<textarea class="code" name="txt" id="impTxt" style="min-height:140px" placeholder='{"version":2,...}'></textarea>`)}`,d=>{
    let o;try{o=JSON.parse(d.txt)}catch(e){throw new Error('O conteúdo não é um JSON válido.')}
    const errs=validateBackup(o);if(errs.length)throw new Error('Backup inválido: '+errs.join(' '));
    confirmBox(`Substituir os dados atuais por este backup (${o.accounts.length} contas, ${o.cards.length} cartões, ${o.tx.length} lançamentos)?`,'Importar',()=>{S=o;migrate();save();closeModal();toast('Backup importado com sucesso.');render()},false);
    return false;
  },{submit:'Validar e importar',init:f=>{$('#impFile',f).addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{$('#impTxt',f).value=String(rd.result).replace(/^﻿/,'');toast('Arquivo carregado. Toque em Validar e importar.')};rd.onerror=()=>toast('Não consegui ler o arquivo.','err');rd.readAsText(file)})}});
}

function removeDemo(){
  S.accounts=S.accounts.filter(x=>!x.demo);S.cards=S.cards.filter(x=>!x.demo);S.recs=S.recs.filter(x=>!x.demo);S.tx=S.tx.filter(x=>!x.demo);S.goals=S.goals.filter(x=>!x.demo);S.people=S.people.filter(x=>!x.demo);
  for(const t of S.tx)if(t.goalId&&!getGoal(t.goalId))t.goalId='';
  for(const k of S.meta.demoBudgets||[])delete S.budgets[k];S.meta.demoBudgets=[];
  bust();
}
